version: "3.9"

# services:
  tests-full:
    build: .
    image: rbt-playwright-suites-full
    container_name: suites-full
    shm_size: "1gb"
    environment:
      CI: "1"
      TEST_MODE: "full"
      BASE_URL: ${BASE_URL:-https://the-internet.herokuapp.com}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
      - ./test-results:/app/test-results
    command: ["npm", "run", "test:full"]

  tests-rbt:
    build: .
    image: rbt-playwright-suites-rbt
    container_name: suites-rbt
    shm_size: "1gb"
    environment:
      CI: "1"
      TEST_MODE: "rbt"
      RBT_N: ${RBT_N:-10}
      BASE_URL: ${BASE_URL:-https://the-internet.herokuapp.com}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
      - ./test-results:/app/test-results
    # Script includes pipe (risk-engine | xargs ...), so MUST run via shell
    command: ["sh", "-c", "npm run test:rbt"]

  risk-update:
    build: .
    image: rbt-playwright-suites-risk-update
    container_name: suites-risk-update
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
    - ./test-results:/app/test-results   # ✅ REQUIRED
    - ./risk:/app/risk                   # ✅ persist updates
    command: ["npm", "run", "risk:update"]

  # ✅ Orchestrator: ONE command, sequential execution
  ci-all:
    build: .
    image: rbt-playwright-suites
    container_name: suites-ci-all
    shm_size: "1gb"
    environment:
      CI: "1"
      # We'll explicitly set TEST_MODE per step in the command
      RBT_N: ${RBT_N:-10}
      BASE_URL: ${BASE_URL:-https://the-internet.herokuapp.com}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
      - ./test-results:/app/test-results
      
    command: >
      sh -c "
      echo '=== 1) FULL SUITE ===' &&
      TEST_MODE=full npm run test:full &&
      echo '=== 2) RISK UPDATE ===' &&
      npm run risk:update &&
      echo '=== 3) RBT SUITE ===' &&
      TEST_MODE=rbt npm run test:rbt
      "


services:
  base:
    build:
      context: .
      dockerfile: Dockerfile
    image: rbt-playwright-suites
    shm_size: "1gb"

  tests-full:
    image: rbt-playwright-suites
    container_name: suites-full
    environment:
      CI: "1"
      TEST_MODE: "full"
      BASE_URL: ${BASE_URL:-https://the-internet.herokuapp.com}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
      - ./test-results:/app/test-results
    command: ["npm", "run", "test:full"]
    depends_on:
      - base

  tests-rbt:
    image: rbt-playwright-suites
    container_name: suites-rbt
    environment:
      CI: "1"
      TEST_MODE: "rbt"
      RBT_N: ${RBT_N:-10}
      BASE_URL: ${BASE_URL:-https://the-internet.herokuapp.com}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
      - ./test-results:/app/test-results
    command: ["sh", "-c", "npm run test:rbt"]
    depends_on:
      - base

  risk-update:
    image: rbt-playwright-suites
    container_name: suites-risk-update
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
      - ./test-results:/app/test-results
      - ./risk:/app/risk
    command: ["npm", "run", "risk:update"]
    depends_on:
      - base

  ci-all:
    image: rbt-playwright-suites
    container_name: suites-ci-all
    shm_size: "1gb"
    environment:
      CI: "1"
      RBT_N: ${RBT_N:-10}
      BASE_URL: ${BASE_URL:-https://the-internet.herokuapp.com}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-test}
    volumes:
      - ./test-results:/app/test-results
    command: >
      sh -c "
      echo '=== 1) FULL SUITE ===' &&
      TEST_MODE=full npm run test:full &&
      echo '=== 2) RISK UPDATE ===' &&
      npm run risk:update &&
      echo '=== 3) RBT SUITE ===' &&
      TEST_MODE=rbt npm run test:rbt
      "
    depends_on:
      - base
